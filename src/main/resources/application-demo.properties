# === Demo profile overrides (activated via -Dspring-boot.run.profiles=demo) ===

# Route the datasource through P6Spy so the cross-schema JOIN guard can inspect SQL.
spring.datasource.url=jdbc:p6spy:postgresql://localhost:5432/shopapp
spring.datasource.driver-class-name=com.p6spy.engine.spy.P6SpyDriver

# Persist the schema across restarts (NOT create-drop) so the event_publication table — and
# any rows left incomplete by a killed listener — survive the restart the outbox-resilience
# demo relies on. Reset between rehearsals with: docker compose down -v.
spring.jpa.hibernate.ddl-auto=update

# Outbox resilience: on restart, redeliver any event_publication rows left incomplete.
spring.modulith.events.republish-outstanding-events-on-restart=true

# Outbox failure toggle (default OFF). Arm it on the FIRST demo run with
#   -Dspring-boot.run.arguments=--demo.fulfillment.fail-once=true
# then restart WITHOUT it so the redelivered event completes.
demo.fulfillment.fail-once=false

# Export traces to the local Jaeger container (docker-compose) over OTLP/HTTP.
# Boot 4 ships NO default endpoint — without this property traces silently go nowhere.
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

# Kafka's clients dump ~80 lines of resolved config at the first externalized publish (and at
# topic creation) — right on top of the fan-out beat's four business log lines. WARN keeps a
# down broker visible while silencing the INFO noise.
logging.level.org.apache.kafka=WARN

# Hibernate's 12-line "Database info" block (mostly "undefined/unknown" — it can't see inside
# Hikari) prints at every boot, and three beats restart the app on stage. WARN hides it.
logging.level.org.hibernate.orm.connections.pooling=WARN

# Hibernate echoes ~20 SQL statements per order, straight through the fan-out beat's business
# log lines — the room ends up scanning instead of reading. Nothing in the talk needs the SQL:
# the outbox is shown in the DB console, and the cross-schema guard prints the offending
# statement inside its own exception message.
spring.jpa.show-sql=false

# The default correlation pattern prints a 32-char traceId next to a 16-char spanId that
# differs per line — unmatchable from the back row, which is exactly what the fan-out beat
# asks the room to do. Eight characters of traceId, no spanId: "one trace id" becomes visible
# instead of asserted.
logging.pattern.correlation=[%.-8mdc{traceId:-}]
