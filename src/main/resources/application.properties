spring.application.name=shop-app

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/shopapp
spring.datasource.username=shopapp
spring.datasource.password=shopapp
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-init.sql

# Kafka
spring.kafka.bootstrap-servers=localhost:29092

# Moments API
spring.modulith.moments.enable-time-machine=false
spring.modulith.moments.zone-id=Europe/Berlin

# Payment Gateway (Spring HTTP Interface — see order/internal/PaymentGatewayHttpConfig)
shop.payment-gateway.enabled=true
shop.payment-gateway.base-url=http://localhost:8080
spring.http.serviceclient.payment.base-url=${shop.payment-gateway.base-url}
spring.http.serviceclient.payment.connect-timeout=2s
spring.http.serviceclient.payment.read-timeout=5s

# Observability + Actuator
management.endpoints.web.exposure.include=health,modulith
management.tracing.sampling.probability=1.0
logging.pattern.correlation=[${spring.application.name:},%mdc{traceId:-},%mdc{spanId:-}]
# Boot 4's default console pattern would prepend [shop-app] a second time once tracing is active.
logging.include-application-name=false
# micrometer-registry-otlp (pulled by spring-boot-starter-opentelemetry) would otherwise POST
# metrics to localhost:4318 every 60s in every profile, tests included.
management.otlp.metrics.export.enabled=false
