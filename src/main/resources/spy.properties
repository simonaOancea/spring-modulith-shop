# P6Spy is engaged only when the JDBC URL is jdbc:p6spy:... (demo profile only — see
# application-demo.properties). The real driver P6Spy wraps:
driverlist=org.postgresql.Driver

# Core spy engine only — the P6Log module is disabled (Hibernate's show-sql already logs SQL),
# which also stops the default FileLogger from creating a stray spy.log in the working directory.
# SPI-registered listeners (META-INF/services -> AssertQueriesDontJoinSchemas) fire regardless.
modulelist=com.p6spy.engine.spy.P6SpyFactory

# Belt and braces: if anything internal ever logs anyway, send it to SLF4J, not a file.
appender=com.p6spy.engine.spy.appender.Slf4JLogger
